# Pinned build inputs of ./Dockerfile (test image) and Dockerfile.runtime.
#
# One line per input: NAME ARCH SCOPE SHA256 PURL
#
#   NAME    what the Dockerfiles pass to verify-inputs.sh (ql-archive/FILE for
#           a Quicklisp release archive)
#   ARCH    any, or the Debian architecture a binary input belongs to
#   SCOPE   runtime  compiled into or copied into the shipped runtime image
#           build    used to build the runtime image, not shipped in it
#           test     used by the test image
#   SHA256  file SHA-256, or the tree/package digest verify-inputs.sh defines
#   PURL    package URL: the version (a commit for a git input, the Debian
#           version for a package) is enforced; the SBOM reads it as well
#
# Enforced inside the build by tools/build-inputs/verify-inputs.sh, which runs
# after each download and before anything downloaded is loaded, executed or
# compiled; a mismatch fails the build. scripts/pins-check.sh checks from the
# control plane that the vendored RocksDB archive and the digest written into
# both Dockerfiles agree with this file.
#
# Refreshing an input: change the version in the Dockerfile and here, build,
# and copy the `record:` line the failing check prints -- only after checking
# the new bytes against the upstream's own published digest (the Quicklisp
# client-info.sexp and the dist's releases.txt carry digests; the Debian
# archive signs its Packages files; a git input names its commit). Keep the
# list sorted by kind as below.

# Vendored in tools/rocksdb (also checked inline by both Dockerfiles, whose
# RocksDB layer runs before this file is copied so its build cache survives).
rocksdb-source            any    runtime,test   d5e78b69e0fb2960576fd5f21c9f3d1a02f635da61159b01942ff285e891c9c0  pkg:github/facebook/rocksdb@v11.1.2

