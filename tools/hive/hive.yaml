# Only "eth1". Not "eth1_snap": the public client now negotiates snap/1 and
# uses its bounded downloader, but Hive's HIVE_NODETYPE=snap still has no honest
# explicit strategy and the sync simulator supplies no consensus-authorized
# target for that downloader. Claiming the role would therefore enter a suite
# under a configuration the client deliberately refuses.
roles:
  - "eth1"
