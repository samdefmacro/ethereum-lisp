name: tests

on:
  push:
  pull_request:

# The layers run in the container, not on the runner. The Dockerfile is the only
# place that knows how to build this environment: the Quicklisp dependencies the
# .asd declares (ironclad, cffi) pinned to a dist, CL_SOURCE_REGISTRY so plain
# ASDF can see them, and the two CFFI shims compiled into libethckzg.so and
# libethbls.so. A runner with apt sbcl has none of that and dies at
# MISSING-DEPENDENCY before the first test, which is what it did on every run
# until now.
env:
  TEST_IMAGE: ethereum-lisp-sbcl-test:go1.24-bookworm

jobs:
  layers:
    strategy:
      fail-fast: false
      matrix:
        layer: [unit, integration, e2e]
    runs-on: ubuntu-latest
    # Only the e2e layer reads this. The container path defaults to 2 workers
    # because it is also used on a developer machine shared with other work;
    # a CI runner is ours alone, so keep the 4 this job asked for before.
    env:
      DOCKER_E2E_JOBS: 4
    steps:
      - uses: actions/checkout@v4
      # Built with buildx against a cache shared by every job in the matrix, so
      # the c-kzg and blst compile happens once per Dockerfile change rather
      # than once per job. load: true puts it in the daemon under the tag the
      # Makefile expects, and DOCKER_TEST_IMAGE_PREBUILT stops make from
      # rebuilding it with the default builder, which would not see this cache.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.TEST_IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run layer
        env:
          DOCKER_TEST_IMAGE_PREBUILT: 1
        run: make "docker-test-${{ matrix.layer }}"

  # The layers above run with no fixture corpus, so every execution-spec-tests
  # case reports itself SKIPPED -- which in a green build reads exactly like
  # passing. This job is the one that actually measures conformance.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.TEST_IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Keyed on the pinned release, so a pin bump fetches rather than reusing
      # the previous corpus. The checksum in the script is what makes reuse safe.
      - name: Cache fixture corpus
        uses: actions/cache@v4
        with:
          path: .eest-fixtures
          key: eest-${{ hashFiles('scripts/fetch-eest-fixtures.sh') }}
      - name: Fetch fixtures
        run: |
          root="$(make eest-fixtures)"
          echo "ETHEREUM_LISP_EXECUTION_SPEC_TESTS_ROOT=$root" >> "$GITHUB_ENV"
      # THE ROOT ALONE RUNS NOTHING. The replay cases need a selector list as
      # well, and without one they report themselves skipped exactly as they do
      # with no corpus at all -- so the job would download 4.2 GB, execute zero
      # vectors, and go green. `auto` means "every case the classifier finds".
      # Both the root and the selectors reach the suite through the Makefile,
      # which bind-mounts the corpus and forwards these into the container.
      # No fork env is set, so this stays on the London/Shanghai + Shanghai
      # defaults the gate has always run -- the blocking job's coverage is
      # unchanged. What is new is that the count-manifest guard
      # (phase-a-eest-*-conformance-is-non-vacuous) now runs here too and turns a
      # corpus that discovers zero cases for a required fork from a green skip
      # into a red failure. The shard guard runs in every job as part of the
      # suite. Late-fork EXECUTION is deliberately NOT enabled here; it lives in
      # the separate conformance-late-forks job below.
      - name: Run conformance layers
        env:
          DOCKER_TEST_IMAGE_PREBUILT: 1
          ETHEREUM_LISP_PHASE_A_STATE_TEST_SELECTORS: auto
          ETHEREUM_LISP_PHASE_A_BLOCKCHAIN_REPLAY_SELECTORS: auto
        run: |
          make docker-test-unit
          make docker-test-integration

  # Late-fork conformance: Cancun, Prague, and Osaka (the newest implemented
  # fork). SEPARATE from the blocking job above ON PURPOSE. Widening the fork
  # set exercises execution paths that will surface real divergences a later
  # wave must fix -- the standard replay materializer still emits a Shanghai
  # config and engine-fixture-chain-config reads no key past shanghaiTime, so a
  # late-fork case executes under Shanghai rules -- and this job must not fail
  # the build before that work lands. It therefore runs continue-on-error, while
  # the count-manifest guard (which makes the coverage gap VISIBLE rather than
  # silent) and the shard guard run here exactly as everywhere else.
  #
  # TODO(plan Phase 7 -- docs/gap-analysis/public-testnet-readiness-plan.md):
  # once Cancun/Prague/Osaka execution parity lands, wire per-network fork
  # activation through the replay runtime and DROP continue-on-error so this
  # becomes a required gate. Amsterdam stays gated out until plan section 8.
  conformance-late-forks:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.TEST_IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The late-fork surface lives in the stable execution corpus (tests@v20.0.1),
      # not the v5.4.0 baseline the blocking job fetches, so pull that one. A
      # distinct cache key keeps the two corpora from evicting each other.
      - name: Cache fixture corpus
        uses: actions/cache@v4
        with:
          path: .eest-fixtures
          key: eest-stable-${{ hashFiles('scripts/fetch-eest-fixtures.sh') }}
      - name: Fetch stable fixtures
        run: |
          root="$(make eest-fixtures-stable)"
          echo "ETHEREUM_LISP_EXECUTION_SPEC_TESTS_ROOT=$root" >> "$GITHUB_ENV"
      # STATE_TEST_FORKS and BLOCKCHAIN_REPLAY_FORKS REPLACE the supported set,
      # so the pre-late forks must be listed alongside the new ones or their
      # coverage would drop. auto discovery then selects every materializable
      # case across the widened set, and the manifest guard asserts each listed
      # fork actually executed at least one case (a zero is a red -- absorbed
      # here by continue-on-error until Phase 7).
      - name: Run late-fork conformance layers
        env:
          DOCKER_TEST_IMAGE_PREBUILT: 1
          ETHEREUM_LISP_PHASE_A_STATE_TEST_SELECTORS: auto
          ETHEREUM_LISP_PHASE_A_BLOCKCHAIN_REPLAY_SELECTORS: auto
          ETHEREUM_LISP_PHASE_A_STATE_TEST_FORKS: "London,Shanghai,Cancun,Prague,Osaka"
          ETHEREUM_LISP_PHASE_A_BLOCKCHAIN_REPLAY_FORKS: "Shanghai,Cancun,Prague,Osaka"
        run: |
          make docker-test-unit
          make docker-test-integration
