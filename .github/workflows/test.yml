name: tests

on:
  push:
  pull_request:

# The layers run in the container, not on the runner. The Dockerfile is the only
# place that knows how to build this environment: the Quicklisp dependencies the
# .asd declares (ironclad, cffi) pinned to a dist, CL_SOURCE_REGISTRY so plain
# ASDF can see them, and the two CFFI shims compiled into libethckzg.so and
# libethbls.so. A runner with apt sbcl has none of that and dies at
# MISSING-DEPENDENCY before the first test, which is what it did on every run
# until now.
env:
  TEST_IMAGE: ethereum-lisp-sbcl-test:go1.24-bookworm

jobs:
  layers:
    strategy:
      fail-fast: false
      matrix:
        layer: [unit, integration, e2e]
    runs-on: ubuntu-latest
    # Only the e2e layer reads this. The container path defaults to 2 workers
    # because it is also used on a developer machine shared with other work;
    # a CI runner is ours alone, so keep the 4 this job asked for before.
    env:
      DOCKER_E2E_JOBS: 4
    steps:
      - uses: actions/checkout@v4
      # Built with buildx against a cache shared by every job in the matrix, so
      # the c-kzg and blst compile happens once per Dockerfile change rather
      # than once per job. load: true puts it in the daemon under the tag the
      # Makefile expects, and DOCKER_TEST_IMAGE_PREBUILT stops make from
      # rebuilding it with the default builder, which would not see this cache.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.TEST_IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run layer
        env:
          DOCKER_TEST_IMAGE_PREBUILT: 1
        run: make "docker-test-${{ matrix.layer }}"

  # PAX documentation transcripts are executable verification, not prose: the
  # cl-transcript examples in docs/*.lisp are re-run and compared against what
  # they claim. scripts/docs-check.lisp has done that since the manuals landed,
  # but nothing ever invoked it outside `scripts/dev.sh docs-check` on a
  # developer machine -- so a drifted transcript was a red LOCAL build and a
  # green CI one, which inverts the entire point of the mechanism. It is cheap
  # (one container, no fixtures) and it is a first-class objective per
  # PROJECT.md, so it blocks like any other layer.
  #
  # The script's own RED gate is what makes this more than a formality:
  # @DOCS-CHECK-SELFTEST in docs/rlp-manual.lisp is deliberately wrong and MUST
  # fail, so a run in which transcript checking has silently switched itself off
  # reports FAILED instead of passing quietly. Do not "fix" that section.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.TEST_IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check documentation transcripts
        env:
          DOCKER_TEST_IMAGE_PREBUILT: 1
        run: make docker-docs-check

  # The layers above run with no fixture corpus, so every execution-spec-tests
  # case reports itself SKIPPED -- which in a green build reads exactly like
  # passing. This job is the one that actually measures conformance.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.TEST_IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Keyed on the pinned release, so a pin bump fetches rather than reusing
      # the previous corpus. The checksum in the script is what makes reuse safe.
      - name: Cache fixture corpus
        uses: actions/cache@v4
        with:
          path: .eest-fixtures
          key: eest-${{ hashFiles('scripts/fetch-eest-fixtures.sh') }}
      - name: Fetch fixtures
        run: |
          root="$(make eest-fixtures)"
          echo "ETHEREUM_LISP_EXECUTION_SPEC_TESTS_ROOT=$root" >> "$GITHUB_ENV"
      # THE ROOT ALONE RUNS NOTHING. The replay cases need a selector list as
      # well, and without one they report themselves skipped exactly as they do
      # with no corpus at all -- so the job would download 4.2 GB, execute zero
      # vectors, and go green. `auto` means "every case the classifier finds".
      # Both the root and the selectors reach the suite through the Makefile,
      # which bind-mounts the corpus and forwards these into the container.
      # No fork env is set, so this stays on the London/Shanghai + Shanghai
      # defaults the gate has always run -- the blocking job's coverage is
      # unchanged. What is new is that the count-manifest guard
      # (phase-a-eest-*-conformance-is-non-vacuous) now runs here too and turns a
      # corpus that discovers zero cases for a required fork from a green skip
      # into a red failure. The shard guard runs in every job as part of the
      # suite. Late-fork EXECUTION is deliberately NOT enabled here; it lives in
      # the separate conformance-late-forks job below.
      - name: Run conformance layers
        id: layers
        # tee so the report step below can read the count manifest. `shell: bash`
        # selects `bash --noprofile --norc -eo pipefail`; the default `bash -e`
        # does NOT set pipefail, so a bare pipe would report tee's status and a
        # red conformance run would go green -- the exact inversion this job
        # exists to prevent.
        shell: bash
        env:
          DOCKER_TEST_IMAGE_PREBUILT: 1
          ETHEREUM_LISP_PHASE_A_STATE_TEST_SELECTORS: auto
          ETHEREUM_LISP_PHASE_A_BLOCKCHAIN_REPLAY_SELECTORS: auto
        run: |
          mkdir -p "$RUNNER_TEMP/conformance"
          make docker-test-unit 2>&1 | tee "$RUNNER_TEMP/conformance/run.log"
          make docker-test-integration 2>&1 | tee -a "$RUNNER_TEMP/conformance/run.log"
      # The EEST-CONFORMANCE count manifest is the only record of WHAT this job
      # measured, and until now it lived solely in a log that ages out. Pair it
      # with the identity of the corpus that produced it -- release, upstream
      # commit, pinned SHA-256, re-hashed archive -- and the revision under
      # test, then archive it: plan section 2 asks for versioned conformance
      # reports and the release exit criteria require archived count manifests.
      #
      # always(), because a failing run is when the counts are worth most.
      # --require-manifest only when the layers completed: the manifest tests
      # are integration-layer, so a run that died in the unit layer never
      # reaches them and is already red for a better reason. Where it does
      # apply, it turns "passed having measured nothing" -- corpus absent, or no
      # selector -- into a failure instead of an evidence-free green.
      - name: Build conformance report
        if: always()
        shell: bash
        run: |
          report="$RUNNER_TEMP/conformance/eest-conformance-report.txt"
          args=(--job conformance
                --log "$RUNNER_TEMP/conformance/run.log"
                --fixture-root "${ETHEREUM_LISP_EXECUTION_SPEC_TESTS_ROOT:-}"
                --output "$report")
          if [ "${{ steps.layers.outcome }}" = "success" ]; then
            args+=(--require-manifest)
          fi
          rc=0
          scripts/conformance-report.sh "${args[@]}" || rc=$?
          {
            echo '### EEST conformance report'
            echo
            echo '```'
            cat "$report" 2>/dev/null || echo '(no report was written)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Archive conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eest-conformance-report
          path: ${{ runner.temp }}/conformance/eest-conformance-report.txt
          if-no-files-found: error

  # Late-fork conformance: Cancun, Prague, and Osaka (the newest implemented
  # fork). SEPARATE from the blocking job above ON PURPOSE. Since f78b991d the
  # standard replay materializer derives each case's chain config from its own
  # network and engine-fixture-chain-config reads cancunTime/pragueTime/
  # osakaTime, so a late-fork case admitted by the widened network gate now
  # EXECUTES under its own ruleset instead of under Shanghai. That is what makes
  # this job worth running, and equally why it cannot block yet: every genuine
  # Cancun/Prague/Osaka divergence now surfaces as a real failure, and burning
  # those down is plan section 7 rather than a prerequisite for reaching it. The
  # V3+ engine-payload path (blob gas, parent beacon root, requests) is still
  # not materialized and stays an honest counted skip. It therefore runs
  # continue-on-error, while the count-manifest guard (which makes the coverage
  # gap VISIBLE rather than silent) and the shard guard run here exactly as
  # everywhere else, and the report step archives the counts either way.
  #
  # TODO(plan Phase 7 -- docs/gap-analysis/public-testnet-readiness-plan.md):
  # once Cancun/Prague/Osaka execution parity lands, DROP continue-on-error so
  # this becomes a required gate. Amsterdam stays gated out until plan section 8.
  conformance-late-forks:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.TEST_IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The late-fork surface lives in the stable execution corpus (tests@v20.0.1),
      # not the v5.4.0 baseline the blocking job fetches, so pull that one. A
      # distinct cache key keeps the two corpora from evicting each other.
      - name: Cache fixture corpus
        uses: actions/cache@v4
        with:
          path: .eest-fixtures
          key: eest-stable-${{ hashFiles('scripts/fetch-eest-fixtures.sh') }}
      - name: Fetch stable fixtures
        run: |
          root="$(make eest-fixtures-stable)"
          echo "ETHEREUM_LISP_EXECUTION_SPEC_TESTS_ROOT=$root" >> "$GITHUB_ENV"
      # STATE_TEST_FORKS and BLOCKCHAIN_REPLAY_FORKS REPLACE the supported set,
      # so the pre-late forks must be listed alongside the new ones or their
      # coverage would drop. auto discovery then selects every materializable
      # case across the widened set, and the manifest guard asserts each listed
      # fork actually executed at least one case (a zero is a red -- absorbed
      # here by continue-on-error until Phase 7).
      - name: Run late-fork conformance layers
        id: layers
        # See the blocking job: tee under `shell: bash` (-eo pipefail) so the
        # report step gets the manifest without the pipeline swallowing make's
        # exit status.
        shell: bash
        env:
          DOCKER_TEST_IMAGE_PREBUILT: 1
          ETHEREUM_LISP_PHASE_A_STATE_TEST_SELECTORS: auto
          ETHEREUM_LISP_PHASE_A_BLOCKCHAIN_REPLAY_SELECTORS: auto
          ETHEREUM_LISP_PHASE_A_STATE_TEST_FORKS: "London,Shanghai,Cancun,Prague,Osaka"
          ETHEREUM_LISP_PHASE_A_BLOCKCHAIN_REPLAY_FORKS: "Shanghai,Cancun,Prague,Osaka"
        run: |
          mkdir -p "$RUNNER_TEMP/conformance"
          make docker-test-unit 2>&1 | tee "$RUNNER_TEMP/conformance/run.log"
          make docker-test-integration 2>&1 | tee -a "$RUNNER_TEMP/conformance/run.log"
      # This job is expected to be red for a while, which is exactly why its
      # counts must outlive the log: the per-fork executed=[...] numbers across
      # releases are the record of the late-fork surface closing. always() is
      # load-bearing here -- continue-on-error keeps a failed job from failing
      # the workflow, but it does not keep a failed STEP from skipping the ones
      # after it. Distinct artifact name and corpus (tests@v20.0.1) from the
      # blocking job's report.
      - name: Build late-fork conformance report
        if: always()
        shell: bash
        run: |
          report="$RUNNER_TEMP/conformance/eest-conformance-report-late-forks.txt"
          args=(--job conformance-late-forks
                --log "$RUNNER_TEMP/conformance/run.log"
                --fixture-root "${ETHEREUM_LISP_EXECUTION_SPEC_TESTS_ROOT:-}"
                --output "$report")
          if [ "${{ steps.layers.outcome }}" = "success" ]; then
            args+=(--require-manifest)
          fi
          rc=0
          scripts/conformance-report.sh "${args[@]}" || rc=$?
          {
            echo '### EEST late-fork conformance report'
            echo
            echo '```'
            cat "$report" 2>/dev/null || echo '(no report was written)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Archive late-fork conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eest-conformance-report-late-forks
          path: ${{ runner.temp }}/conformance/eest-conformance-report-late-forks.txt
          if-no-files-found: error
